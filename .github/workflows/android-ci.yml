name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miroir-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run connected Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest

  release-version:
    name: Validate release version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version bump and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"

          CHANGED_FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if ! grep -Eq '^(app/|gradle.properties$|build.gradle.kts$|settings.gradle.kts$|gradle/)' <<< "$CHANGED_FILES"; then
            echo "No application or build changes; release version bump is not required."
            exit 0
          fi

          BASE_VERSION="$(git show "origin/$BASE_REF:gradle.properties" | sed -n 's/^VERSION_NAME=//p')"
          HEAD_VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | head -n 1)"

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Base VERSION_NAME '$BASE_VERSION' is not valid SemVer (X.Y.Z)."
            exit 1
          fi
          if [[ ! "$HEAD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION_NAME '$HEAD_VERSION' must follow SemVer (X.Y.Z)."
            exit 1
          fi

          if ! python3 - "$BASE_VERSION" "$HEAD_VERSION" <<'PY'
          import sys
          base = tuple(map(int, sys.argv[1].split(".")))
          head = tuple(map(int, sys.argv[2].split(".")))
          if head <= base:
              print(f"VERSION_NAME must increase for every release-triggering PR: {sys.argv[1]} -> {sys.argv[2]}", file=sys.stderr)
              sys.exit(1)
          PY
          then
            echo "::error::Increase VERSION_NAME relative to the target branch."
            exit 1
          fi

          if ! grep -Fq "## [$HEAD_VERSION] -" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain a dated section '## [$HEAD_VERSION] - YYYY-MM-DD'."
            exit 1
          fi

          echo "Release version validated: $BASE_VERSION -> $HEAD_VERSION"
